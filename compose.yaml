name: laporan-keuangan

services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${DB_ADMIN_PASSWORD}
      APP_DB_DATABASE: ${DB_DATABASE}
      APP_DB_USERNAME: ${DB_USERNAME}
      APP_DB_PASSWORD: ${DB_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./infrastructure/docker/init-db.sh:/docker-entrypoint-initdb.d/10-create-app-database.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d postgres"]
      interval: 5s
      timeout: 5s
      retries: 20
    networks: [backend]

  app:
    build:
      context: .
      dockerfile: infrastructure/docker/Dockerfile
      target: runtime
    restart: unless-stopped
    env_file: .env
    environment:
      APP_ENV: local
      APP_DEBUG: "true"
    command: ["php-fpm", "-F"]
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - private_data:/var/www/html/storage/app/private
      - backup_data:/backups
    healthcheck:
      test: ["CMD-SHELL", "php -r '$$socket=@fsockopen(\"127.0.0.1\",9000); exit($$socket?0:1);'"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks: [frontend, backend]

  worker:
    image: laporan-keuangan-app
    restart: unless-stopped
    env_file: .env
    command: ["php", "artisan", "queue:work", "--sleep=2", "--tries=3", "--timeout=600"]
    depends_on:
      app:
        condition: service_healthy
    volumes:
      - private_data:/var/www/html/storage/app/private
      - backup_data:/backups
    networks: [backend]

  scheduler:
    image: laporan-keuangan-app
    restart: unless-stopped
    env_file: .env
    command: ["php", "artisan", "schedule:work"]
    depends_on:
      app:
        condition: service_healthy
    volumes:
      - private_data:/var/www/html/storage/app/private
      - backup_data:/backups
    networks: [backend]

  web:
    build:
      context: .
      dockerfile: infrastructure/docker/Dockerfile
      target: nginx
    restart: unless-stopped
    ports:
      - "${APP_PORT:-8181}:80"
    depends_on:
      app:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks: [frontend]

volumes:
  postgres_data:
  private_data:
  backup_data:

networks:
  frontend:
    driver: bridge
  backend:
    driver: bridge
    internal: true
