services:
  db:
    # Debian-based image remains compatible with the CentOS 7 production host.
    image: postgres:17-bookworm
    ports: []
  app:
    environment:
      APP_ENV: production
      APP_DEBUG: "false"
      SESSION_SECURE_COOKIE: "true"
  worker:
    environment:
      APP_ENV: production
      APP_DEBUG: "false"
      SESSION_SECURE_COOKIE: "true"
  scheduler:
    environment:
      APP_ENV: production
      APP_DEBUG: "false"
      SESSION_SECURE_COOKIE: "true"
  web:
    ports: !override
      - "127.0.0.1:${APP_PORT:-8181}:80"
